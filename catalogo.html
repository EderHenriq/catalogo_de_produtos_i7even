<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>i7even Store · Catálogo</title>
  <meta name="description" content="iPhones lacrados e seminovos, Apple Watch, AirPods e mais - preços atualizados, garantia e pedido direto pelo WhatsApp.">
  <!-- O link vai para quem a loja manda - fora dos buscadores (o netlify.toml reforça). -->
  <meta name="robots" content="noindex, nofollow, noarchive">
  <meta name="color-scheme" content="light dark">
  <meta name="theme-color" content="#0e0f11">
  <meta name="referrer" content="strict-origin-when-cross-origin">
  <meta name="apple-mobile-web-app-title" content="i7even">

  <!-- Prévia do link no WhatsApp / Instagram (URL absoluta: o WhatsApp não aceita relativa).
       Domínio próprio no ar? Troque o endereço abaixo (og:image e og:url) pelo novo. -->
  <meta property="og:type" content="website">
  <meta property="og:title" content="Catálogo i7even Store">
  <meta property="og:description" content="iPhones lacrados e seminovos com garantia. Escolha e peça pelo WhatsApp.">
  <meta property="og:url" content="https://i7evenpedidos.netlify.app/catalogo.html">
  <meta property="og:image" content="https://i7evenpedidos.netlify.app/assets/brand/og-catalogo.jpg">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta name="twitter:card" content="summary_large_image">

  <link rel="icon" href="assets/brand/i7even-avatar-i7.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="assets/brand/i7even-avatar-i7.svg">
  <link rel="preconnect" href="https://vsfrnhynhzhpzeymavtx.supabase.co" crossorigin>
  <!--
    Os dados do catálogo começam a vir junto com o HTML, sem esperar o
    JavaScript (o catalog.js pede esta mesma URL e recebe a resposta pronta).
    GET simples, sem cabeçalhos: o navegador não faz a consulta extra (CORS).
    A chave é a "publishable" - a mesma do config.js, feita para ser pública.
  -->
  <link rel="preload" as="fetch" crossorigin="anonymous" href="https://vsfrnhynhzhpzeymavtx.supabase.co/rest/v1/rpc/public_catalog?apikey=sb_publishable__GLUx1HnUtWOQSL3H9iGHA_yBneT7Gh">
  <link rel="modulepreload" href="assets/js/catalog.js">
  <link rel="modulepreload" href="assets/js/config.js">
  <link rel="modulepreload" href="assets/js/core/utils.js">
  <link rel="modulepreload" href="assets/js/ui/icons.js">
  <link rel="preload" href="assets/fonts/sora-200-700-latin.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="assets/css/fonts.css">

  <link rel="stylesheet" href="assets/css/tokens.css">
  <link rel="stylesheet" href="assets/css/base.css">
  <link rel="stylesheet" href="assets/css/catalog.css">
  <script src="assets/js/preload-theme.js"></script>
</head>
<body class="catalog">
  <div id="catalog">
    <div class="cat-boot"><span class="cat-spinner"></span><span>Carregando o catálogo…</span></div>
  </div>
  <noscript><p style="padding:40px;text-align:center">Ative o JavaScript para ver o catálogo.</p></noscript>
  <script type="module" src="assets/js/catalog.js"></script>
</body>
</html>
