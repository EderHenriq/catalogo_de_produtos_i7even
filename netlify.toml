#  Netlify - i7even Store
#  Site estático puro: não há build, o Netlify só publica os arquivos da raiz.

[build]
  publish = "."
  command = ""

# --------------------------------------------------------------- cabeçalhos

[[headers]]
  for = "/*"
  [headers.values]
    # Só HTTPS, por um ano, incluindo subdomínios.
    Strict-Transport-Security = "max-age=31536000; includeSubDomains; preload"

    # Ninguém coloca este painel dentro de um iframe.
    X-Frame-Options = "DENY"

    # O navegador respeita o Content-Type declarado, sem adivinhar.
    X-Content-Type-Options = "nosniff"

    # Não vaza a URL completa para sites externos.
    Referrer-Policy = "strict-origin-when-cross-origin"

    # Recursos do aparelho que a página nunca precisa.
    # Câmera só para o próprio site (foto do produto no iPhone/Android); o resto bloqueado.
    Permissions-Policy = "accelerometer=(), camera=(self), geolocation=(), gyroscope=(), magnetometer=(), microphone=(), payment=(), usb=(), interest-cohort=()"

    # Painel interno: fora dos buscadores.
    X-Robots-Tag = "noindex, nofollow, noarchive"

    # Isola a janela de outras origens.
    Cross-Origin-Opener-Policy = "same-origin"

    # Lista branca do que a página pode carregar e com quem pode falar.
    #   script-src  → nosso código + o cliente do Supabase no jsDelivr
    #   connect-src → API e realtime do Supabase, e a consulta de CEP (ViaCEP)
    #   style-src 'unsafe-inline' → necessário para os estilos aplicados em atributo style
    Content-Security-Policy = """
      default-src 'self';
      base-uri 'self';
      object-src 'none';
      frame-ancestors 'none';
      form-action 'self';
      script-src 'self' https://cdn.jsdelivr.net;
      style-src 'self' 'unsafe-inline' https://fonts.googleapis.com;
      font-src 'self' https://fonts.gstatic.com;
      img-src 'self' data: blob: https://*.supabase.co;
      connect-src 'self' https://*.supabase.co wss://*.supabase.co https://viacep.com.br;
      manifest-src 'self';
      worker-src 'self';
      upgrade-insecure-requests
    """

# O HTML nunca fica em cache: assim uma atualização aparece na hora.
[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# Service worker dos avisos de vencimento: sempre a versão mais nova.
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"
    Service-Worker-Allowed = "/"

# Os arquivos do app revalidam a cada visita (rápido por ETag, mas sempre atual).
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# Catálogo: o link que vai para o cliente. Continua fora do Google (noindex
# do bloco geral); para aparecer em busca, troque o X-Robots-Tag só aqui.
[[headers]]
  for = "/catalogo.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# ----------------------------------------------------------------- rotas --
# A navegação é por hash (#/pedidos), então qualquer caminho cai no index.

# Pastas internas (SQL, testes, documentação) não são servidas pelo site.
[[redirects]]
  from = "/supabase/*"
  to = "/404"
  status = 404
  force = true

[[redirects]]
  from = "/tests/*"
  to = "/404"
  status = 404
  force = true

[[redirects]]
  from = "/contextos/*"
  to = "/404"
  status = 404
  force = true

[[redirects]]
  from = "/CLAUDE.md"
  to = "/404"
  status = 404
  force = true

[[redirects]]
  from = "/09_guia_para_replicar.md"
  to = "/404"
  status = 404
  force = true

[[redirects]]
  from = "/.github/*"
  to = "/404"
  status = 404
  force = true

[[redirects]]
  from = "/README.md"
  to = "/404"
  status = 404
  force = true

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
